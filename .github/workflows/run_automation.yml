name: Run TMA Automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: '実行するアクション'
        required: true
        type: choice
        default: 'reserve'
        options:
          - reserve
          - cancel_all
      pw_mode:
        description: 'PWモード（現在有効な方を選択）'
        required: true
        type: choice
        default: 'mode1'
        options:
          - mode1
          - mode2
      station:
        description: 'ステーション名 (例: 大和テストST) ※reserve時のみ使用'
        required: false
        default: 'テストステーション'
      plate:
        description: '車両ナンバー (例: 品川500あ1234) ※reserve時のみ使用'
        required: false
        default: '品川500あ1234'
      reservation_time:
        description: '予約日時 (例: 2026-02-24 10:30) ※reserve時のみ使用'
        required: false
        default: '2026-02-24 10:30'
  repository_dispatch:
    types: [webhook_from_gas]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        # 元の requirements.txt を使うか、直接インストールするか環境に合わせてね
        run: |
          pip install selenium webdriver-manager

      - name: Run Automation Script (Manual / 手動テスト用)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.action }}" = "cancel_all" ]; then
            PAYLOAD="{\"action\": \"cancel_all\", \"pw_mode\": \"${{ github.event.inputs.pw_mode }}\"}"
          else
            PAYLOAD="{\"action\": \"reserve\", \"pw_mode\": \"${{ github.event.inputs.pw_mode }}\", \"station\": \"${{ github.event.inputs.station }}\", \"plate\": \"${{ github.event.inputs.plate }}\", \"reservation_time\": \"${{ github.event.inputs.reservation_time }}\"}"
          fi
          python main.py "$PAYLOAD"

      - name: Run Automation Script (Webhook / GASからの連携用)
        if: github.event_name == 'repository_dispatch'
        run: |
          PAYLOAD='${{ toJson(github.event.client_payload) }}'
          python main.py "$PAYLOAD"

      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: evidence/
