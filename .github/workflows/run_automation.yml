name: Run TMA Automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: '実行するアクション'
        required: true
        type: choice
        default: 'reserve'
        options:
          - reserve
          - cancel_all
      pw_mode:
        description: 'PWモード（現在有効な方を選択）'
        required: true
        type: choice
        default: 'mode1'
        options:
          - mode1
          - mode2
      station:
        description: 'ステーション名 (例: 大和テストST) ※reserve時のみ使用'
        required: false
        default: 'テストステーション'
      plate:
        description: '車両ナンバー (例: 品川500あ1234) ※reserve時のみ使用'
        required: false
        default: '品川500あ1234'
      reservation_time:
        description: '予約日時 (例: 2026-02-24 10:30) ※reserve時のみ使用'
        required: false
        default: '2026-02-24 10:30'
  repository_dispatch:
    types: [webhook_from_gas]

# 予約・取消が同時に走ってTMA側で競合しないよう、1本ずつ順番に実行する
concurrency:
  group: zendai-tma
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        # 元の requirements.txt を使うか、直接インストールするか環境に合わせてね
        run: |
          pip install selenium webdriver-manager

      - name: Run Automation Script (Manual / 手動テスト用)
        if: github.event_name == 'workflow_dispatch'
        env:
          TMA_ID: ${{ secrets.TMA_ID }}
          TMA_PW_MODE1: ${{ secrets.TMA_PW_MODE1 }}
          TMA_PW_MODE2: ${{ secrets.TMA_PW_MODE2 }}
          IN_ACTION: ${{ github.event.inputs.action }}
          IN_PW_MODE: ${{ github.event.inputs.pw_mode }}
          IN_STATION: ${{ github.event.inputs.station }}
          IN_PLATE: ${{ github.event.inputs.plate }}
          IN_TIME: ${{ github.event.inputs.reservation_time }}
        run: |
          # 入力値は環境変数経由でPythonに渡してJSON化する（ステーション名の ' や " でシェルが壊れないように）
          PAYLOAD=$(python -c 'import json,os; a=os.environ["IN_ACTION"]; d={"action":a,"pw_mode":os.environ["IN_PW_MODE"]}; d.update({} if a=="cancel_all" else {"station":os.environ["IN_STATION"],"plate":os.environ["IN_PLATE"],"reservation_time":os.environ["IN_TIME"]}); print(json.dumps(d, ensure_ascii=False))')
          python main.py "$PAYLOAD"

      - name: Run Automation Script (Webhook / GASからの連携用)
        if: github.event_name == 'repository_dispatch'
        env:
          TMA_ID: ${{ secrets.TMA_ID }}
          TMA_PW_MODE1: ${{ secrets.TMA_PW_MODE1 }}
          TMA_PW_MODE2: ${{ secrets.TMA_PW_MODE2 }}
          # client_payloadは環境変数経由で渡す（シェルの引用符に直接埋め込むと ' を含むステーション名で壊れるため）
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python main.py "$PAYLOAD"

      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: evidence/
